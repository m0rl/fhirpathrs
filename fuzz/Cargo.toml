[package]
name = "fhirpathrs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
parser = { path = "../crates/parser" }
interpreter = { path = "../crates/interpreter" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpret"
path = "fuzz_targets/interpret.rs"
test = false
doc = false
bench = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
